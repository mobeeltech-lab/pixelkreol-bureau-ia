    router_settings:
      num_retries: 3
      fallbacks: ["pk-costaud", "pk-rapide"]

  # 4 Legacy Models
  - model_name: "pk-rapide"
    litellm_params:
      model: "openrouter/gwen/gwen-3.8-27b:free"
    router_settings:
      num_retries: 2
      fallbacks: ["pk-costaud"]
  
  - model_name: "pk-costaud"
    litellm_params:
      model: "openrouter/anthropic/claude-opus"
    router_settings:
      num_retries: 3
  
  - model_name: "pk-code"
    litellm_params:
      model: "openrouter/openai/gpt-4"
    router_settings:
      num_retries: 3
      fallbacks: ["pk-costaud"]
  
  - model_name: "pk-vision"
    litellm_params:
      model: "openrouter/openai/gpt-4-vision"
    router_settings:
      num_retries: 2
      fallbacks: ["pk-costaud"]

router_settings:
  routing_strategy: "usage_based_routing_v2"

litellm_settings:
  drop_params: true
  set_verbose: true
