model_list:
  # 9 Specialized Agents
  - model_name: "02-photography-specialist"
    litellm_params:
      model: "openrouter/openai/gpt-4-vision"
    router_settings:
      num_retries: 3
      fallbacks: ["pk-vision", "pk-costaud"]
  
  - model_name: "03-restaurant-hotel-specialist"
    litellm_params:
      model: "openrouter/anthropic/claude-opus"
    router_settings:
      num_retries: 3
      fallbacks: ["pk-costaud", "pk-rapide"]
  
  - model_name: "04-real-estate-specialist"
    litellm_params:
