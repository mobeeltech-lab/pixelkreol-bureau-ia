# A ajouter a la configuration nginx existante sur ce VPS
# (ne remplace rien, s'ajoute a cote de pmu-pronostics)

server {
    listen 80;
    listen [::]:80;
    server_name agents.mebeeltech.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name agents-n8n.mebeeltech.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
# Une fois le DNS pointe vers ce VPS, certbot --nginx -d agents.mebeeltech.online -d agents-n8n.mebeeltech.online ajoutera automatiquement le HTTPS (comme pour pmu.mebeeltech.online).
