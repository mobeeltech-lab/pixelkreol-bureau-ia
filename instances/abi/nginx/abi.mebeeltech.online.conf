# Modèle de site nginx — interface de test ABI Holding (Open WebUI sur 127.0.0.1:3101).
# Installation : voir LISEZMOI.md (copier dans /etc/nginx/sites-available/, activer, puis lancer certbot).
# Ce fichier ne contient que le bloc HTTP : « certbot --nginx » obtient le certificat, ajoute le bloc HTTPS
# et la redirection tout seul. Les lignes proxy_* ci-dessous sont conservées par certbot.

server {
    listen 80;
    listen [::]:80;
    server_name abi.mebeeltech.online;

    # envoi de fichiers raisonnable (documents à archiver)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Open WebUI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # réponses des agents affichées au fil de l'eau, réponses longues acceptées
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
